name: Publish release images

on:
  workflow_run:
    workflows: [Finify CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-main
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - id: release
        env:
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          PUBLIC_API_URL: ${{ vars.PUBLIC_API_URL }}
        run: |
          test -n "$PUBLIC_API_URL" || { echo "Configure repository variable PUBLIC_API_URL" >&2; exit 1; }
          case "$PUBLIC_API_URL" in https://*) ;; *) echo "PUBLIC_API_URL must use HTTPS" >&2; exit 1;; esac
          echo "sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: producer
            context: .
            dockerfile: Dockerfile
            target: production
          - image: consumer
            context: ./consumer-service
            dockerfile: ./consumer-service/Dockerfile
            target: runtime
          - image: accounting
            context: ./accounting-service
            dockerfile: ./accounting-service/Dockerfile
            target: runtime
          - image: credit-rules
            context: ./credit-rule-service
            dockerfile: ./credit-rule-service/Dockerfile
            target: runtime
          - image: kyc
            context: ./kyc-service
            dockerfile: ./kyc-service/Dockerfile
            target: runtime
          - image: kyc-ocr
            context: ./kyc-ocr-service
            dockerfile: ./kyc-ocr-service/Dockerfile
            target: ''
          - image: admin-ui
            context: ./admin-ui
            dockerfile: ./admin-ui/Dockerfile
            target: runtime
          - image: portal-ui
            context: ./portal-ui
            dockerfile: ./portal-ui/Dockerfile
            target: runtime
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: true
          tags: ghcr.io/${{ github.repository }}/${{ matrix.image }}:${{ needs.prepare.outputs.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.PUBLIC_API_URL }}
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ vars.TURNSTILE_SITE_KEY }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          provenance: mode=max
          sbom: true
