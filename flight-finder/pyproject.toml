[project]
name = "flexible-flight-finder"
version = "0.1.0"
description = "Compare flexible-date flight prices across custom cabin plans."
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "python-dotenv>=1.0,<2",
  "streamlit>=1.37,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]

